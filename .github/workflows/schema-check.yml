name: schema-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEBULA_SHA: 4e02244695879e823f570f13449d95cb642cd35a
    steps:
      - uses: actions/checkout@v7

      - name: Clone nebula at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/tier4/nebula.git nebula
          git -C nebula checkout "$NEBULA_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run L1 schema tests
        run: python -m pytest -v

      - name: Check that the traceability matrix is up to date
        run: |
          python scripts/build_traceability.py
          git diff --exit-code docs/05_traceability.csv

      - name: Publish schema probe result to the job summary
        if: always()
        run: python scripts/probe_schema.py >> "$GITHUB_STEP_SUMMARY"
